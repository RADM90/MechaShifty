<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>니케 리스트 · 픽업일정</title>
<meta name="description" content="승리의 여신: 니케 캐릭터 목록과 역대·예정 픽업 배너 일정을 필터링해서 보는 도구">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1e35'/%3E%3Cpath d='M8 23V9h3.4l6 8.6V9H21v14h-3.4l-6-8.6V23z' fill='%2300c8c8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<script>
  /* 모듈 스크립트는 defer 라 늦게 뜬다. 첫 페인트 전에 테마를 확정해서
     라이트→다크 깜빡임을 없앤다. 기본값은 라이트. */
  document.documentElement.dataset.theme =
    localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <h1 class="brand">
      <span data-i18n="app.brand">니케 리스트</span>
      <span class="brand-sub" data-i18n="app.brandSub">· 픽업일정</span>
    </h1>
    <div class="topbar-right">
      <div class="langswitch" role="group" data-i18n-aria="ui.langGroup" aria-label="표시 언어">
        <button type="button" data-lang="ko" class="on">한</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">日</button>
      </div>
      <button type="button" id="theme" class="themebtn" aria-pressed="false"
              data-i18n-title="ui.theme" title="테마 전환">
        <span id="themeIcon">☾</span>
      </button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="nikkes" aria-selected="true" data-i18n="tab.nikkes">니케 리스트</button>
    <button type="button" role="tab" data-tab="pickups" aria-selected="false" data-i18n="tab.pickups">픽업일정</button>
    <button type="button" role="tab" data-tab="stats" aria-selected="false" data-i18n="tab.stats">통계</button>
    <button type="button" role="tab" data-tab="calc" aria-selected="false" data-i18n="tab.calc">전투력 계산기</button>
    <button type="button" role="tab" data-tab="outpost" aria-selected="false" data-i18n="tab.outpost">전초기지</button>
    <button type="button" role="tab" data-tab="raw" aria-selected="false" data-i18n="tab.raw">원본 데이터</button>
  </nav>
</header>

<main id="main">

  <div id="loading" class="notice" data-i18n="ui.loading">데이터를 불러오는 중…</div>
  <div id="error" class="notice notice-error" hidden></div>

  <div id="app" hidden>

    <!-- ── 필터 ───────────────────────────────────────────── -->
    <section class="filters" data-i18n-aria="ui.filters" aria-label="필터">
      <div class="filter-head">
        <input type="search" id="q" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="ui.search">
        <span id="count" class="count"></span>
        <button type="button" id="reset" class="btn-reset" data-i18n="ui.reset">필터 초기화</button>
      </div>

      <div id="chipfilters" class="chipgrid"></div>

      <div class="filter-row" id="extrafilters">
        <label class="field">
          <span data-i18n="f.squad">스쿼드</span>
          <select id="squad"><option value="" data-i18n="f.all">전체</option></select>
        </label>
        <label class="field">
          <span data-i18n="f.release">출시일</span>
          <span class="range">
            <input type="date" id="relFrom" data-i18n-aria="f.releaseFrom">
            <em>~</em>
            <input type="date" id="relTo" data-i18n-aria="f.releaseTo">
          </span>
        </label>
      </div>

      <div class="filter-row" id="pickupfilters" hidden>
        <label class="field">
          <span data-i18n="f.rerun">복각</span>
          <select id="rerun">
            <option value="all" data-i18n="f.all">전체</option>
            <option value="first" data-i18n="f.firstOnly">최초 픽업만</option>
            <option value="rerun" data-i18n="f.rerunOnly">복각만</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="tlview"> <span data-i18n="f.timeline">타임라인 보기</span>
        </label>
      </div>
    </section>

    <!-- ── 탭 1: 니케 리스트 ───────────────────────────────── -->
    <section id="panel-nikkes" class="panel">
      <div class="tablewrap">
        <table class="grid" id="nikkeTable">
          <thead><tr id="nikkeHead"></tr></thead>
          <tbody id="nikkeBody"></tbody>
        </table>
      </div>
      <p class="empty" id="nikkeEmpty" hidden data-i18n="msg.emptyNikke">조건에 맞는 니케가 없습니다.</p>
    </section>

    <!-- ── 탭 2: 픽업일정 ─────────────────────────────────── -->
    <section id="panel-pickups" class="panel" hidden>
      <div class="tablewrap" id="pickupTableWrap">
        <table class="grid" id="pickupTable">
          <thead><tr id="pickupHead"></tr></thead>
          <tbody id="pickupBody"></tbody>
        </table>
      </div>
      <div id="timeline" class="timeline" hidden></div>
      <p class="empty" id="pickupEmpty" hidden data-i18n="msg.emptyPickup">조건에 맞는 픽업이 없습니다.</p>
    </section>

    <!-- ── 탭 3: 통계 ─────────────────────────────────────── -->
    <section id="panel-stats" class="panel" hidden>
      <div id="stats"></div>
    </section>

    <!-- ── 탭 4: 전투력 계산기 ────────────────────────────── -->
    <section id="panel-calc" class="panel" hidden>
      <div id="calc"></div>
    </section>

    <!-- ── 탭 5: 전초기지 ─────────────────────────────────── -->
    <section id="panel-outpost" class="panel" hidden>
      <div id="outpost"></div>
    </section>

    <!-- ── 탭 6: 원본 데이터 ──────────────────────────────── -->
    <section id="panel-raw" class="panel" hidden>
      <div id="rawdata" class="rawwrap"></div>
    </section>

  </div>
</main>

<!-- 니케 상세 -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <aside class="sheet-body" role="dialog" aria-modal="true">
    <button type="button" class="sheet-x" data-close data-i18n-aria="ui.close" aria-label="닫기">×</button>
    <div id="sheetContent"></div>
  </aside>
</div>

<footer class="foot">
  <span id="metaline"></span>
</footer>

<div id="tip" class="tip" hidden></div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
